<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Návrhy redesignu webů</title>
<style>
  :root { --ink:#142033; --muted:#56627a; --rule:#d5dce6; --blue:#0d6af6; }
  body { margin:0; background:#fff; color:var(--ink); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:760px; margin:0 auto; padding:56px 16px; }
  h1 { margin:0 0 8px; font-size:2rem; line-height:1.15; }
  p { margin:0; color:var(--muted); }
  ul { list-style:none; margin:32px 0 0; padding:0; border-top:1px solid var(--rule); }
  li { border-bottom:1px solid var(--rule); }
  a { display:flex; justify-content:space-between; gap:16px; padding:16px 0; color:inherit; text-decoration:none; }
  a b { font-size:1.1rem; }
  a span { color:var(--muted); font-size:.9rem; }
  a:hover b { color:var(--blue); }
  a:focus-visible { outline:2px solid var(--blue); outline-offset:4px; }
  .note { margin-top:28px; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Návrhy redesignu webů</h1>
  <p>Neoficiální ukázky nového vzhledu webů firem. Nejde o oficiální stránky uvedených společností.</p>
  <ul>
    <li><a href="ferrum-form/"><b>FERRUM FORM</b><span>kovárna Malá Morávka · 5 stránek</span></a></li>
  </ul>
  <p class="note">Fotografie v návrzích jsou ilustrační.</p>
</main>
</body>
</html>
